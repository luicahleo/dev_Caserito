# Producción VPS Trajano. La imagen se construye y valida por SHA desde el workflow.
# Desarrollo local: docker-compose.dev.yml.
services:
  caseritoapp:
    image: caseritoapp:${CASERITOAPP_IMAGE_TAG:-latest}
    container_name: caseritoapp
    restart: unless-stopped
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_HTTP_PORTS: "8080"
      TZ: "America/La_Paz"
      Migraciones__EjecutarAlArranque: "true"
    ports:
      - "127.0.0.1:8084:8080"
    volumes:
      - /var/apps/caseritoapp/fotos-avisos:/data/fotos-avisos
      - /var/apps/caseritoapp/kyc-blobs:/data/kyc-blobs
      - /var/apps/caseritoapp/dataprotection-keys:/data/dataprotection-keys
    networks: [trajano-shared-network]
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  trajano-shared-network:
    external: true
