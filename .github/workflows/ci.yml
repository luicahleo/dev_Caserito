name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CaseritoApp
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: CaseritoApp/global.json

      - name: Restore
        run: dotnet restore CaseritoApp.sln

      - name: Verificar formato
        run: dotnet format CaseritoApp.sln --verify-no-changes --no-restore

      - name: Build (warnings as errors)
        run: dotnet build CaseritoApp.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test CaseritoApp.sln --no-build --configuration Release --verbosity normal

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: CaseritoApp/global.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Emitir OpenAPI (build del host)
        run: dotnet build src/Host/CaseritoApp.Host/CaseritoApp.Host.csproj -p:GenerateOpenApi=true
        working-directory: CaseritoApp
        env:
          ASPNETCORE_ENVIRONMENT: Testing

      - name: Instalar deps web
        run: npm ci
        working-directory: web

      - name: Regenerar tipos del cliente
        run: npm run generate:api
        working-directory: web

      - name: Verificar que no hay deriva de contrato
        run: git diff --exit-code -- CaseritoApp/artifacts/openapi/CaseritoApp.Host.json web/src/api/schema.d.ts
