# Extensión opcional de docker-compose.dev.yml para levantar ARGOS en local.
# ARGOS es el microservicio Python de reconocimiento facial que consume CaseritoApp.
# Uso: docker compose -f docker-compose.dev.yml -f docker-compose.argos.yml up
#
# Requisitos:
#   - El repo de ARGOS debe estar en ../dev/ARGOS relativo a este archivo.
#   - ~4 GB RAM disponibles para el contenedor.
#   - Primera ejecución descarga el modelo ArcFace (~137 MB).
services:
  argos:
    build:
      context: ../dev/ARGOS
      dockerfile: Dockerfile
    container_name: caserito-argos
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "5000"
      # ICARUS_API_URL no se usa por Caserito, pero ARGOS lo espera para health check.
      # Apuntamos a la API de Caserito para evitar warnings; no es obligatorio que responda.
      ICARUS_API_URL: "http://api:8080"
    ports:
      # Expuesto solo para depuración manual; Caserito backend usa la red interna.
      - "127.0.0.1:5000:5000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import requests; r=requests.get('http://localhost:5000/health', timeout=5); exit(0 if r.status_code==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  api:
    environment:
      Argos__Url: "http://argos:5000"
      Argos__ApiKey: "${ARGOS_API_KEY:-}"
    # ARGOS es un microservicio opcional para Caserito; la API debe arrancar
    # independientemente de su estado. Si ARGOS no responde, el adaptador HTTP
    # de KYC devuelve HTTP 503 sin dejar caer el resto de la aplicación.
